name: Locally teardown
description: Stop `locally ci` and upload its log as an artifact on job failure.

inputs:
  upload-logs-on-failure:
    description: Whether to upload `ci.log` as a workflow artifact when the job has failed.
    default: 'true'
  job-status:
    description: >-
      The status of the calling job. Composite actions can't see whether the
      calling job's steps have failed - `failure()` here only reports on this
      action's own steps - so this defaults to the calling job's `job.status`.
    default: ${{ job.status }}

runs:
  using: composite
  steps:
    - name: Stop `locally ci`
      shell: bash
      run: locally ci --stop || true

    # Undo `configure-dns`, so that a self-hosted runner isn't left routing
    # *.locally to a port nothing is listening on (or something else is).
    - name: Remove DNS configuration for `*.locally`
      if: env.LOCALLY_DNS_CONFIGURED == 'true'
      shell: bash
      run: |
        # Windows runners already run elevated (and have no sudo).
        if [ "$RUNNER_OS" = "Windows" ]; then
          sudo=()
        else
          sudo=(sudo -n --)
        fi
        "${sudo[@]}" "$LOCALLY_CLI_PATH" configure dns --remove ||
          echo "::warning::Failed to remove the DNS configuration for *.locally"

    # `failure()` would only report on this action's own steps, so check the
    # calling job's status instead.
    - name: Upload CI log on failure
      if: always() && inputs.upload-logs-on-failure == 'true' && inputs.job-status == 'failure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # Artifact names must be unique within a run, so a matrix job needs
        # one per leg.
        name: locally-ci-log-${{ github.job }}${{ strategy.job-total > 1 && format('-{0}', strategy.job-index) || '' }}
        path: ${{ env.LOCALLY_WORKING_DIRECTORY }}/ci.log
        if-no-files-found: ignore
